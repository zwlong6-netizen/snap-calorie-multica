name: CI/CD Pipeline & Automated Health Check

on:
  push:
    branches: [ main, 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & E2E Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Test Suites
        run: npm test

  deploy-verify:
    name: Service Start & Health Probe Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Service in Background
        run: |
          PORT=3001 node server/index.js &
          echo "Waiting for service to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:3001/health | grep '"status":"UP"'; then
              echo "Service is healthy!"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed!"
          exit 1

      - name: Verify API & Static Assets
        run: |
          curl -f -s http://localhost:3001/ | grep '<title>'
          curl -f -s http://localhost:3001/api/summary | grep '"success":true'
          echo "All sanity checks passed!"
